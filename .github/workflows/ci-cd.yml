name: CloudDesk DevSecOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ========================================
  # JOB 1 — Automated Testing & Build Gate
  # ========================================
  test:
    name: Unit Tests & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run Backend Pytest Suite (Failing Gate)
        run: pytest -v
        working-directory: backend

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build Bundle
        run: |
          npm ci
          npm run build
        working-directory: frontend

  # ========================================
  # JOB 2 — Docker Build, Trivy Security Scan & GHCR Push
  # ========================================
  build-scan-push:
    name: Container Build, Security Scan & GHCR Push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Image Names (Lowercase)
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${OWNER_LOWER}/clouddesk-backend:${{ github.sha }}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER_LOWER}/clouddesk-frontend:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build Backend Docker Image
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }} ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t ${{ env.FRONTEND_IMAGE }} ./frontend

      - name: Scan Backend Image with Trivy (Fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Scan Frontend Image with Trivy (Fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Push Container Images to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ${{ env.BACKEND_IMAGE }}
          docker push ${{ env.FRONTEND_IMAGE }}

  # ========================================
  # JOB 3 — Kubernetes Smoke-Test Deployment (Kind + Helm)
  # ========================================
  deploy-smoke-test:
    name: Helm Deploy Smoke Test (Kind Cluster)
    needs: build-scan-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Kubernetes Kind Cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: clouddesk-ci

      - name: Configure Image Names
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMG_REPO=ghcr.io/${OWNER_LOWER}/clouddesk-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMG_REPO=ghcr.io/${OWNER_LOWER}/clouddesk-frontend" >> $GITHUB_ENV

      - name: Apply Namespace Manifest
        run: kubectl apply -f k8s/namespace.yaml

      - name: Deploy Application with Helm
        run: |
          helm upgrade --install clouddesk ./helm/clouddesk \
            --namespace clouddesk \
            --set backend.image=${{ env.BACKEND_IMG_REPO }} \
            --set backend.tag=${{ github.sha }} \
            --set frontend.image=${{ env.FRONTEND_IMG_REPO }} \
            --set frontend.tag=${{ github.sha }} \
            --set ingress.enabled=false \
            --set postgres.persistence.enabled=false

      - name: Verify Cluster Resources
        run: |
          echo "=== Deployments ==="
          kubectl get deployments -n clouddesk
          echo "=== Services ==="
          kubectl get services -n clouddesk
          echo "=== Helm Status ==="
          helm list -n clouddesk
