apiVersion: v1
kind: Service
metadata:
  name: clouddesk-backend
  namespace: clouddesk
spec:
  selector:
    app: clouddesk-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: clouddesk-frontend
  namespace: clouddesk
spec:
  selector:
    app: clouddesk-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
