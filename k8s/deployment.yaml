apiVersion: apps/v1
kind: Deployment
metadata:
  name: clouddesk-backend
  namespace: clouddesk
  labels:
    app: clouddesk-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clouddesk-backend
  template:
    metadata:
      labels:
        app: clouddesk-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/__REPO_OWNER__/clouddesk-backend:__IMAGE_TAG__
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "sqlite:///./clouddesk.db"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clouddesk-frontend
  namespace: clouddesk
  labels:
    app: clouddesk-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clouddesk-frontend
  template:
    metadata:
      labels:
        app: clouddesk-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/__REPO_OWNER__/clouddesk-frontend:__IMAGE_TAG__
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
