apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clouddesk
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/bharath-kadali/devsecops-project.git
    targetRevision: main
    path: helm/clouddesk
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: clouddesk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
