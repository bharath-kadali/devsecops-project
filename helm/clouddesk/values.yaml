frontend:
  image: ghcr.io/bharath-kadali/clouddesk-frontend
  tag: latest
  port: 8080

backend:
  image: ghcr.io/bharath-kadali/clouddesk-backend
  tag: latest
  port: 8000

replicaCount: 2
namespace: clouddesk
imagePullSecrets: []

postgres:
  host: clouddesk-postgres
  database: clouddesk
  username: clouddesk
  password: clouddesk
  persistence:
    enabled: false

ingress:
  enabled: true
  host: clouddesk.local

hpa:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

monitoring:
  serviceMonitor:
    enabled: true
