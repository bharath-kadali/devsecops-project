services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clouddesk
      POSTGRES_USER: clouddesk
      POSTGRES_PASSWORD: clouddesk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clouddesk -d clouddesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://clouddesk:clouddesk@postgres:5432/clouddesk
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  postgres-data:
